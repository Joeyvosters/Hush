<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hush — White Noise</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="description" content="A calm, offline white-noise player. Rain, ocean, fan, and breeze sounds with a sleep timer.">
<meta name="theme-color" content="#0d0b14">
<!-- iOS home-screen / standalone -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hush">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<!-- iOS Home Screen icon MUST be a PNG (SVG is ignored → blank/coloured square). -->
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<style>
  :root{
    --bg:#0d0b14;
    --bg2:#141020;
    --card:#1b1626;
    --card-hi:#2a2140;
    --line:#2c2540;
    --text:#eee7ff;
    --muted:#9a90b5;
    --accent:#b79bff;
    --accent2:#7c5cff;
    --glow:rgba(124,92,255,.45);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; height:100%;}
  body{
    background:
      radial-gradient(120% 80% at 50% -10%, #1a1330 0%, var(--bg) 55%) fixed;
    color:var(--text);
    font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column;
    min-height:100dvh;
    padding:
      calc(env(safe-area-inset-top) + 8px)
      calc(env(safe-area-inset-right) + 18px)
      calc(env(safe-area-inset-bottom) + 14px)
      calc(env(safe-area-inset-left) + 18px);
    overscroll-behavior:none;
    user-select:none; -webkit-user-select:none;
  }
  header{text-align:center; padding:6px 0 2px;}
  header h1{margin:0; font-size:22px; font-weight:650; letter-spacing:.5px;}
  header p{margin:2px 0 0; font-size:12.5px; color:var(--muted);}

  /* ---------- Top bar: Sleep (left) · More Sounds (right) ---------- */
  .topbar{display:flex; justify-content:space-between; align-items:center; gap:10px;
          max-width:520px; width:100%; margin:0 auto;}
  .menubtn{
    display:inline-flex; align-items:center; gap:7px;
    background:var(--card); border:1px solid var(--line); color:var(--text);
    border-radius:999px; padding:9px 14px; font:inherit; font-size:13.5px; cursor:pointer;
    transition:background .15s, border-color .15s, transform .1s;
  }
  .menubtn:active{transform:scale(.97);}
  .menubtn .ic{font-size:15px; line-height:1;}
  .menubtn .lbl{font-weight:550;}
  .menubtn .cv{color:var(--muted); font-size:10px; transition:transform .2s;}
  .menubtn.open{border-color:var(--accent2); background:var(--card-hi);}
  .menubtn.open .cv{transform:rotate(180deg);}
  .menubtn.active{border-color:var(--accent2);}
  .menubtn.active .lbl{color:var(--accent); font-variant-numeric:tabular-nums;}

  /* ---------- Center: big play button ---------- */
  main{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
       gap:18px; max-width:520px; width:100%; margin:0 auto; min-height:0;}
  .play{
    width:154px; height:154px; border-radius:50%;
    border:none; cursor:pointer; position:relative;
    background:radial-gradient(circle at 35% 30%, var(--accent2), #4b32b8 70%);
    box-shadow:0 0 0 1px rgba(255,255,255,.06), 0 18px 55px -12px var(--glow);
    color:#fff; display:grid; place-items:center;
    transition:transform .15s ease;
  }
  .play:active{transform:scale(.96);}
  .play svg{width:58px; height:58px; margin-left:3px;}
  .play.playing svg{margin-left:0;}
  .play.loading svg{opacity:.3;}
  .play .ring{position:absolute; inset:-12px; border-radius:50%; border:2px solid var(--glow); opacity:0;}
  .play.playing .ring{animation:pulse 3.2s ease-out infinite;}
  .play.loading::after{
    content:""; position:absolute; inset:-12px; border-radius:50%;
    border:2px solid transparent; border-top-color:var(--accent);
    animation:spin .8s linear infinite;
  }
  @keyframes pulse{0%{transform:scale(1);opacity:.6} 100%{transform:scale(1.28);opacity:0}}
  @keyframes spin{to{transform:rotate(360deg)}}
  .now{min-height:20px; font-size:15px; color:var(--muted); letter-spacing:.3px;}
  .now b{color:var(--text); font-weight:600;}

  /* ---------- Bottom: volume slider with a big grab handle ---------- */
  .bottom{max-width:520px; width:100%; margin:0 auto;}
  .vol{display:flex; align-items:center; gap:14px;}
  .vol svg{width:22px; height:22px; color:var(--muted); flex:none;}
  input[type=range]{
    -webkit-appearance:none; appearance:none; width:100%; height:10px; border-radius:999px;
    background:linear-gradient(90deg,var(--accent2) var(--fill,65%), var(--line) var(--fill,65%));
    outline:none; cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:34px; height:34px; border-radius:50%;
    background:#fff; border:none; box-shadow:0 3px 10px rgba(0,0,0,.55); cursor:grab;
    transition:transform .1s;
  }
  input[type=range]:active::-webkit-slider-thumb{cursor:grabbing; transform:scale(1.08);}
  input[type=range]::-moz-range-thumb{
    width:34px; height:34px; border:none; border-radius:50%;
    background:#fff; box-shadow:0 3px 10px rgba(0,0,0,.55); cursor:grab;
  }
  input[type=range]:focus-visible{outline:2px solid var(--accent); outline-offset:5px;}

  footer{text-align:center; font-size:11.5px; color:var(--muted); opacity:.7; padding-top:14px; line-height:1.5;}

  /* ---------- Dropdown panels ---------- */
  .scrim{position:fixed; inset:0; background:rgba(5,4,10,.5); opacity:0; pointer-events:none;
         transition:opacity .2s; z-index:20;}
  .scrim.show{opacity:1; pointer-events:auto;}
  .panel{
    position:fixed; z-index:30; top:calc(env(safe-area-inset-top) + 56px);
    background:var(--bg2); border:1px solid var(--line); border-radius:16px;
    box-shadow:0 22px 55px -16px rgba(0,0,0,.75); padding:7px; min-width:198px; max-width:78vw;
    opacity:0; transform:translateY(-8px) scale(.98); pointer-events:none;
    transition:opacity .16s, transform .16s;
  }
  .panel.show{opacity:1; transform:none; pointer-events:auto;}
  .panel-left{left:calc(env(safe-area-inset-left) + 18px);}
  .panel-right{right:calc(env(safe-area-inset-right) + 18px);}
  .panel h4{margin:5px 9px 7px; font-size:10.5px; letter-spacing:.13em; text-transform:uppercase;
            color:var(--muted); font-weight:600;}
  .opt{
    display:flex; align-items:center; gap:11px; width:100%;
    background:transparent; border:none; color:var(--text); font:inherit; font-size:14px;
    padding:10px 11px; border-radius:11px; cursor:pointer; text-align:left;
    transition:background .12s, transform .1s;
  }
  .opt:active{transform:scale(.98);}
  .opt .ico{font-size:19px; width:24px; text-align:center; flex:none; filter:saturate(1.1);}
  .opt .txt{display:flex; flex-direction:column; gap:1px; min-width:0;}
  .opt .nm{font-weight:550;}
  .opt .sub{font-size:11px; color:var(--muted);}
  .opt .chk{margin-left:auto; color:var(--accent); opacity:0; font-size:13px; flex:none;}
  .opt.on{background:var(--card-hi);}
  .opt.on .chk{opacity:1;}

  @media (max-height:640px){ .play{width:124px; height:124px;} .play svg{width:48px; height:48px;} main{gap:14px;} }
  @media (prefers-reduced-motion:reduce){
    .play.playing .ring{animation:none;} .play.loading::after{animation:none;}
    *{transition-duration:.01ms !important;}
  }
</style>
</head>
<body>
<header class="topbar">
  <button class="menubtn" id="sleepBtn" aria-haspopup="true" aria-expanded="false">
    <span class="ic">🌙</span><span class="lbl" id="sleepLabel">Sleep</span><span class="cv">▾</span>
  </button>
  <button class="menubtn" id="soundsBtn" aria-haspopup="true" aria-expanded="false">
    <span class="ic" id="soundsIco">🍃</span><span class="lbl" id="soundsLabel">Breeze</span><span class="cv">▾</span>
  </button>
</header>

<main>
  <button class="play" id="play" aria-label="Play or pause">
    <span class="ring"></span>
    <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
  </button>
  <div class="now" id="now">Pick a sound</div>
</main>

<div class="bottom">
  <div class="vol">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 10v4h4l5 5V5L7 10H3z"/></svg>
    <input type="range" id="vol" min="0" max="100" value="65" aria-label="Volume">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 10v4h4l5 5V5L7 10H3zm11.5 2A4.5 4.5 0 0012 8.03v7.94A4.5 4.5 0 0014.5 12zM12 3.23v2.06a7 7 0 010 13.42v2.06A9 9 0 0012 3.23z"/></svg>
  </div>
</div>

<footer id="footer">
  In Safari, tap <b>Share → Add to Home Screen</b> for full-screen &amp; offline.
</footer>

<div class="scrim" id="scrim"></div>
<div class="panel panel-left" id="sleepPanel" role="menu" aria-label="Sleep timer"></div>
<div class="panel panel-right" id="soundsPanel" role="menu" aria-label="More sounds"></div>

<audio id="audio" loop playsinline preload="auto"></audio>

<script>
"use strict";
(function(){
  // ---------- Sound definitions (all synthesized, no files) ----------
  // color: base noise. filter: optional biquad. am: optional amplitude wave (whole cycles => seamless).
  // Note: white/pink/brown are no longer selectable tiles, but makeBase() still
  // generates them internally — they're the building blocks for the sounds below.
  const SOUNDS = [
    { id:"rain",  name:"Rain",  ico:"🌧️", desc:"bright patter", color:"white", filter:{type:"highpass", freq:820, Q:0.5} },
    { id:"ocean", name:"Ocean", ico:"🌊", desc:"slow swells", color:"brown", filter:{type:"lowpass", freq:520, Q:0.5}, am:{period:11, depth:0.55} },
    { id:"fan",   name:"Fan",   ico:"💨", desc:"steady whir", color:"pink",  filter:{type:"lowpass", freq:1100, Q:0.6} },
    // Breeze: Brown's deep body + Fan's airy filtered-pink layer, with gusting swells
    // (several amplitude waves summed) so the volume drifts across the whole loop.
    { id:"breeze", name:"Breeze", ico:"🍃", desc:"gusting air",
      mix:[
        { color:"brown", gain:1.0 },
        { color:"pink", filter:{type:"lowpass", freq:1100, Q:0.6}, gain:0.85 },
      ],
      filter:{type:"lowpass", freq:1000, Q:0.5},
      am:{ waves:[ {period:41, depth:0.34}, {period:13, depth:0.22}, {period:5.5, depth:0.13} ] } },
    // Coffee Shop (☕) is intentionally NOT listed here — it's a work in progress. Its
    // synth (buildCoffeeShop, below) is kept for continued iteration; to expose it again,
    // re-add a tile: { id:"coffee", name:"Coffee Shop", ico:"☕", build:buildCoffeeShop }.
  ];

  const SR = 44100;
  // A natively-looped <audio> buffer is the only way to keep sound going while the
  // phone is LOCKED (live Web Audio gets suspended). A loop repeats by definition, so
  // the only lever against an audible "short clip" cycle is length: 5 minutes here means
  // the ear never latches onto the repeat. Raise LOOP_SECONDS for an even longer period
  // (costs ~5.3 MB of memory per extra minute).
  const LOOP_SECONDS = 300;        // 5-minute loop
  const XF = Math.floor(SR*0.5);   // crossfade fold length (samples)
  const WARMUP = 8192;             // filter warm-up discarded so there's no start transient
  const N = SR*LOOP_SECONDS;       // usable samples
  const M = N + XF;                // generated samples (extra for the fold)

  const TIMERS = [0,15,30,45,60,90]; // minutes

  // ---------- State ----------
  const state = {
    soundId: null,
    playing: false,
    volume: 0.65,
    timerMin: 0,
    timerEndsAt: 0,   // epoch ms
  };
  const masters = {}; // id -> Int16Array (normalised, full-volume PCM master)
  let cachedId = null; // only the current sound is kept in memory (buffers are large)
  function cache(id, m){
    if(cachedId && cachedId !== id) delete masters[cachedId];
    masters[id] = m; cachedId = id;
  }

  // ---------- Elements ----------
  const el = {
    play: document.getElementById("play"),
    playIcon: document.getElementById("playIcon"),
    now: document.getElementById("now"),
    vol: document.getElementById("vol"),
    sleepBtn: document.getElementById("sleepBtn"),
    sleepLabel: document.getElementById("sleepLabel"),
    sleepPanel: document.getElementById("sleepPanel"),
    soundsBtn: document.getElementById("soundsBtn"),
    soundsIco: document.getElementById("soundsIco"),
    soundsLabel: document.getElementById("soundsLabel"),
    soundsPanel: document.getElementById("soundsPanel"),
    scrim: document.getElementById("scrim"),
    audio: document.getElementById("audio"),
  };

  const DEFAULT_SOUND = "breeze";

  const ICON_PLAY  = 'M8 5v14l11-7z';
  const ICON_PAUSE = 'M6 5h4v14H6zm8 0h4v14h-4z';

  // ---------- Noise generators ----------
  function makeBase(color, len){
    const out = new Float32Array(len);
    if(color === "white"){
      for(let i=0;i<len;i++) out[i] = Math.random()*2-1;
    } else if(color === "pink"){
      let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
      for(let i=0;i<len;i++){
        const w = Math.random()*2-1;
        b0=0.99886*b0+w*0.0555179; b1=0.99332*b1+w*0.0750759;
        b2=0.96900*b2+w*0.1538520; b3=0.86650*b3+w*0.3104856;
        b4=0.55000*b4+w*0.5329522; b5=-0.7616*b5-w*0.0168980;
        out[i]=(b0+b1+b2+b3+b4+b5+b6+w*0.5362)*0.11;
        b6=w*0.115926;
      }
    } else { // brown
      let last=0;
      for(let i=0;i<len;i++){
        const w = Math.random()*2-1;
        last=(last+0.02*w)/1.02;
        out[i]=last*3.5;
      }
    }
    return out;
  }

  // ---------- Biquad filter (RBJ cookbook), run in plain JS ----------
  // Done inline rather than via OfflineAudioContext so minutes-long buffers render
  // reliably (some engines cap OfflineAudioContext length) and with no extra deps.
  function biquadCoeffs(type, freq, Q){
    const w0 = 2*Math.PI*freq/SR, cos = Math.cos(w0), sin = Math.sin(w0), alpha = sin/(2*Q);
    let b0,b1,b2,a0,a1,a2;
    if(type === "lowpass"){       b0=(1-cos)/2; b1=1-cos;    b2=(1-cos)/2; a0=1+alpha; a1=-2*cos; a2=1-alpha; }
    else if(type === "highpass"){ b0=(1+cos)/2; b1=-(1+cos); b2=(1+cos)/2; a0=1+alpha; a1=-2*cos; a2=1-alpha; }
    else /* bandpass (0 dB peak) */ { b0=alpha; b1=0; b2=-alpha; a0=1+alpha; a1=-2*cos; a2=1-alpha; }
    return { b0:b0/a0, b1:b1/a0, b2:b2/a0, a1:a1/a0, a2:a2/a0 };
  }

  // Apply a biquad in place over the first `len` samples of `arr`.
  function applyBiquad(arr, filter, len){
    const c = biquadCoeffs(filter.type, filter.freq, filter.Q || 0.7);
    let x1=0,x2=0,y1=0,y2=0;
    for(let i=0;i<len;i++){
      const x = arr[i];
      const y = c.b0*x + c.b1*x1 + c.b2*x2 - c.a1*y1 - c.a2*y2;
      x2=x1; x1=x; y2=y1; y1=y;
      arr[i] = y;
    }
  }

  // Equal-power crossfade fold + normalise + quantise to a 16-bit master of length N.
  // Blends the trailing XF into the head so the loop end flows into its start with no
  // click, then scales to a fixed peak (a single uniform gain, so any pre-balanced mix
  // keeps its internal proportions).
  function finalize(base, off){
    for(let i=0;i<XF;i++){
      const t = i/XF;
      base[off+i] = base[off+i]*Math.sin(t*Math.PI/2) + base[off+N+i]*Math.cos(t*Math.PI/2);
    }
    let peak = 1e-6;
    for(let i=0;i<N;i++){ const a=Math.abs(base[off+i]); if(a>peak) peak=a; }
    const g = 0.92/peak;
    const master = new Int16Array(N);
    for(let i=0;i<N;i++){
      let s = base[off+i]*g;
      s = s<-1?-1:s>1?1:s;
      master[i] = s<0 ? s*0x8000 : s*0x7fff;
    }
    return master;
  }

  // Render a sound to a seamless, normalised 16-bit master of length N.
  // A sound is either a single `color` (+ optional `filter`), a `mix` of layers
  // (each its own color + optional per-layer filter + gain) summed together with an
  // optional overall `filter` on top, or a fully custom `build()` that returns its
  // own M-length Float32 buffer (used by Coffee Shop).
  function render(cfg){
    if(cfg.build) return finalize(cfg.build(), 0);

    const hasFilter = !!cfg.filter || (cfg.mix && cfg.mix.some(l=>l.filter));
    const total = hasFilter ? WARMUP + M : M;

    let base;
    if(cfg.mix){
      base = new Float32Array(total);
      for(const layer of cfg.mix){
        const b = makeBase(layer.color, total);
        if(layer.filter) applyBiquad(b, layer.filter, total);
        const g = layer.gain==null ? 1 : layer.gain;
        for(let i=0;i<total;i++) base[i] += b[i]*g;
      }
    } else {
      base = makeBase(cfg.color, total);   // Float32
    }
    if(cfg.filter) applyBiquad(base, cfg.filter, total);

    const off = hasFilter ? WARMUP : 0; // drop the settling transient

    // Amplitude wave(s): each a whole number of cycles over N => seamless across the
    // loop. Summing several (via `am.waves`) makes the level drift more, like gusts.
    if(cfg.am){
      const waves = cfg.am.waves || [cfg.am];
      const envs = waves.map(w=>{
        const cycles = Math.max(1, Math.round(N / (SR*w.period)));
        return { period: N/cycles, depth: w.depth };
      });
      for(let i=0;i<M;i++){
        let mod = 1;
        for(let k=0;k<envs.length;k++) mod += envs[k].depth*Math.sin(2*Math.PI*i/envs[k].period);
        base[off+i] *= mod;
      }
    }

    return finalize(base, off);
  }

  // ---------- Coffee Shop: a fully custom, event-driven ambience ----------
  // Built by summing several procedural layers into one M-length buffer:
  //   • a very soft jazz-piano base (procedural chords over a slow progression)
  //   • a low room-tone bed + a fireplace (low roar with random crackle pops)
  //   • a chatter of many voices — a glottal buzz through vowel-formant bandpasses
  //     (real harmonic/voiced structure, so it reads as people, not wind), syllable-gated
  //   • coffee pours (gurgling water with a rising cup-fill resonance)
  //   • espresso steam bursts that ramp up like a machine building pressure
  //   • an occasional door (hinge creak + latch thud)
  // Discrete events are scheduled clear of the loop's crossfade region on both ends,
  // so finalize()'s fold still seams the continuous beds cleanly.

  const midiToFreq = m => 440*Math.pow(2, (m-69)/12);

  // Bandpass `src` and accumulate the result into `out` (no extra buffer copy).
  function bandpassAccum(src, out, gain, freq, Q, len){
    const c = biquadCoeffs("bandpass", freq, Q);
    let x1=0,x2=0,y1=0,y2=0;
    for(let i=0;i<len;i++){
      const x = src[i];
      const y = c.b0*x + c.b1*x1 + c.b2*x2 - c.a1*y1 - c.a2*y2;
      x2=x1; x1=x; y2=y1; y1=y;
      out[i] += y*gain;
    }
  }

  // A speech-like amplitude envelope: random syllable levels (with pauses) at ~rate Hz,
  // smoothed by a one-pole so there are no clicks between syllables.
  function syllableEnv(len, rate){
    const env = new Float32Array(len);
    const step = SR/rate;
    const a = Math.exp(-1/(SR*0.018));  // ~18 ms smoothing => crisper articulation
    let cur = 0, target = 0.5, nextAt = step;
    for(let i=0;i<len;i++){
      if(i >= nextAt){
        target = Math.random() < 0.16 ? 0 : (0.35 + Math.random()*0.65);
        nextAt += step*(0.55 + Math.random()*0.8);
      }
      cur = target + (cur-target)*a;
      env[i] = cur;
    }
    return env;
  }

  // A glottal "buzz": a sawtooth (rich in harmonics for the formants to shape) at f0 with
  // slow intonation drift, so a formant-filtered copy sounds voiced rather than windy.
  function makeBuzz(len, f0){
    const out = new Float32Array(len);
    let phase = 0;
    for(let i=0;i<len;i++){
      const drift = 1 + 0.06*Math.sin(2*Math.PI*i/(SR*1.3));
      phase += f0*drift/SR; if(phase>=1) phase-=1;
      out[i] = 2*phase-1;
    }
    return out;
  }

  // Coffee pouring into a cup: gurgling filtered water whose resonance rises as the cup
  // fills (a time-varying bandpass swept upward), plus discrete low "glug" blips.
  function addPour(buf, at, durSec, amp){
    const len = Math.floor(durSec*SR);
    const src = makeBase("white", len);
    const f0 = 600, f1 = 1500;          // fill resonance sweeps up over the pour
    let x1=0,x2=0,y1=0,y2=0;
    const atk = SR*0.2, rel = SR*0.5;
    for(let i=0;i<len && at+i<buf.length;i++){
      const c = biquadCoeffs("bandpass", f0 + (f1-f0)*(i/len), 1.2);
      const x = src[i];
      const y = c.b0*x + c.b1*x1 + c.b2*x2 - c.a1*y1 - c.a2*y2;
      x2=x1; x1=x; y2=y1; y1=y;
      let e = 1;
      if(i < atk) e = i/atk; else if(i > len-rel) e = (len-i)/rel;
      // deeper, more irregular gurgle
      const g = 1 + 0.6*Math.sin(2*Math.PI*i/(SR*0.05)) + 0.4*Math.sin(2*Math.PI*i/(SR*0.021))
                  + 0.25*Math.sin(2*Math.PI*i/(SR*0.011));
      buf[at+i] += amp*e*Math.max(0,g)*y;
    }
    // discrete glugs sprinkled through the pour for extra gurgle
    for(let g = at + Math.floor(0.2*SR); g < at+len-0.15*SR; g += Math.floor((0.1+Math.random()*0.18)*SR)){
      const gf = 120 + Math.random()*130, gl = Math.floor((0.05+Math.random()*0.08)*SR);
      for(let i=0;i<gl && g+i<buf.length;i++)
        buf[g+i] += amp*0.5*Math.exp(-i/(gl*0.5))*Math.sin(2*Math.PI*gf*i/SR);
    }
  }

  // Espresso steam that RAMPS UP: hiss whose intensity grows across the burst (machine
  // building pressure), with a quick release at the end.
  function addSteam(buf, at, durSec, amp){
    const len = Math.floor(durSec*SR);
    const n = makeBase("white", len);
    applyBiquad(n, {type:"highpass", freq:2600, Q:0.7}, len);
    const rel = SR*0.5;
    for(let i=0;i<len && at+i<buf.length;i++){
      const frac = i/len;
      let e = 0.2 + 0.8*frac*frac;             // rising crescendo
      if(i > len-rel) e *= (len-i)/rel;        // quick release
      const flutter = 1 + 0.15*Math.sin(2*Math.PI*i/(SR*0.045));
      buf[at+i] += amp*e*flutter*n[i];
    }
  }

  // A door: a hinge creak (swept high-Q bandpass on noise) then a latch thud (low sine +
  // click), a beat later.
  function addDoor(buf, at){
    const cl = Math.floor((0.3+Math.random()*0.3)*SR);
    const n = makeBase("white", cl);
    let x1=0,x2=0,y1=0,y2=0;
    for(let i=0;i<cl && at+i<buf.length;i++){
      const c = biquadCoeffs("bandpass", 400 + 300*Math.sin(2*Math.PI*i/(SR*0.15)), 6);
      const x=n[i]; const y=c.b0*x+c.b1*x1+c.b2*x2-c.a1*y1-c.a2*y2; x2=x1;x1=x;y2=y1;y1=y;
      buf[at+i] += 0.13*Math.sin(Math.PI*i/cl)*y;
    }
    const thud = at + Math.floor((0.25+Math.random()*0.3)*SR), tl = Math.floor(0.28*SR);
    for(let i=0;i<tl && thud+i<buf.length;i++)
      buf[thud+i] += 0.42*Math.exp(-i/(tl*0.22))*Math.sin(2*Math.PI*(88+Math.random()*8)*i/SR);
    for(let i=0;i<280 && thud+i<buf.length;i++)
      buf[thud+i] += 0.2*(Math.random()*2-1)*Math.exp(-i/120);
  }

  // A soft piano note: a few harmonics with exp decay + a gentle attack. Deliberately mellow.
  function addPianoNote(buf, at, freq, durSec, amp){
    const len = Math.floor(durSec*SR), atk = SR*0.012, dec = durSec*SR*0.5;
    const harm = [[1,1.0],[2,0.5],[3,0.26],[4,0.13],[6,0.05]];
    for(const [h,g] of harm){
      const w = 2*Math.PI*freq*h/SR;
      for(let i=0;i<len && at+i<buf.length;i++){
        let e = Math.exp(-i/dec); if(i<atk) e *= i/atk;
        buf[at+i] += amp*g*e*Math.sin(w*i);
      }
    }
  }

  // A very soft jazz-piano base: a slow ii–V–I–vi loop of 7th chords, gently arpeggiated,
  // with an occasional melody note. Kept quiet so it sits under everything.
  function addJazz(buf){
    const root = 46 + Math.floor(Math.random()*4);                 // low root (~Bb2–D3)
    const prog = [ [0,4,7,11], [9,12,16,19], [2,5,9,12], [7,11,14,17] ]; // maj7 / m7 / m7 / 7
    let ci = 0;
    for(let t = XF + 2*SR; t < N - 4*SR; ci++){
      const ch = prog[ci % prog.length];
      addPianoNote(buf, Math.floor(t), midiToFreq(root + ch[0] - 12), 3.2, 0.10); // bass
      for(let k=1;k<ch.length;k++)                                                  // voicing
        addPianoNote(buf, Math.floor(t + (0.05+Math.random()*0.12)*k*SR), midiToFreq(root+ch[k]), 2.6, 0.06);
      if(Math.random() < 0.5){                                                      // melody
        const mel = ch[1 + Math.floor(Math.random()*(ch.length-1))] + 12;
        addPianoNote(buf, Math.floor(t + (0.6+Math.random()*1.2)*SR), midiToFreq(root+mel), 1.6, 0.05);
      }
      t += (3.2 + Math.random()*1.8)*SR;
    }
  }

  function buildCoffeeShop(){
    const len = M;
    const buf = new Float32Array(len);

    // 1. Soft jazz-piano base.
    addJazz(buf);

    // 2. Low room-tone bed (very soft) + fireplace roar with random crackle pops.
    {
      const b1 = makeBase("brown", len), b2 = makeBase("pink", len);
      applyBiquad(b2, {type:"lowpass", freq:600, Q:0.6}, len);
      for(let i=0;i<len;i++) b1[i] = b1[i] + b2[i]*0.5;
      applyBiquad(b1, {type:"lowpass", freq:430, Q:0.5}, len);
      const cyc = Math.max(1, Math.round(len/(SR*23))), per = len/cyc;
      for(let i=0;i<len;i++) buf[i] += b1[i]*0.06*(1 + 0.2*Math.sin(2*Math.PI*i/per));

      const roar = makeBase("brown", len);
      applyBiquad(roar, {type:"lowpass", freq:300, Q:0.6}, len);
      for(let i=0;i<len;i++){
        const flick = 1 + 0.25*Math.sin(2*Math.PI*i/(SR*0.7)) + 0.15*(Math.random()*2-1);
        buf[i] += 0.055*roar[i]*flick;
      }
      // crackles: dense, tiny, quiet decaying pops (fire snaps), off the loop seam
      for(let t = XF; t < N - 0.3*SR; t += (0.05 + Math.random()*0.5)*SR){
        const cat = Math.floor(t), cl = Math.floor((0.004 + Math.random()*0.02)*SR);
        const ca = 0.06 + Math.random()*0.16;
        for(let i=0;i<cl && cat+i<buf.length;i++)
          buf[cat+i] += ca*(Math.random()*2-1)*Math.exp(-i/(cl*0.4));
      }
    }

    // 3. Chatter: many voiced (buzz→formant) speakers, syllable-gated. Shared breath noise
    //    (offset per voice) adds consonants without a full noise buffer each.
    const shared = makeBase("white", len);
    const fg = [1.0, 0.7, 0.42];
    const voices = [
      { f0:130, rate:4.6, fm:[[520,4],[1500,5],[2500,6]], g:0.085 },
      { f0:170, rate:5.1, fm:[[600,4],[1700,5],[2700,6]], g:0.075 },
      { f0:110, rate:4.1, fm:[[480,4],[1400,5],[2400,6]], g:0.085 },
      { f0:200, rate:5.6, fm:[[650,4],[1800,5],[2800,6]], g:0.07  },
      { f0:150, rate:4.9, fm:[[560,4],[1600,5],[2600,6]], g:0.08  },
    ];
    let noff = 0;
    for(const v of voices){
      const buzz = makeBuzz(len, v.f0);
      const src = new Float32Array(len);
      for(let i=0;i<len;i++) src[i] = buzz[i]*0.85 + shared[(i+noff)%len]*0.15;
      const voiced = new Float32Array(len);
      for(let k=0;k<v.fm.length;k++) bandpassAccum(src, voiced, fg[k], v.fm[k][0], v.fm[k][1], len);
      const env = syllableEnv(len, v.rate);
      for(let i=0;i<len;i++) buf[i] += v.g*voiced[i]*env[i];
      noff = (noff + 97003) % len;
    }

    // 4. Coffee pouring — every ~26–50 s, clear of the seam.
    for(let p = XF + 12*SR + Math.random()*18*SR; p < N - 5*SR; p += (26 + Math.random()*24)*SR)
      addPour(buf, Math.floor(p), 2.6 + Math.random()*1.8, 0.22);

    // 5. Espresso steam (ramping) — frequent, every ~20–40 s, clear of the seam.
    for(let s = XF + 8*SR + Math.random()*15*SR; s < N - 7*SR; s += (20 + Math.random()*20)*SR)
      addSteam(buf, Math.floor(s), 2.5 + Math.random()*3.5, 0.27);

    // 6. Door open/close — occasional, every ~70–130 s, clear of the seam.
    for(let d = XF + 20*SR + Math.random()*40*SR; d < N - 2*SR; d += (70 + Math.random()*60)*SR)
      addDoor(buf, Math.floor(d));

    // Gentle soft-limit so the sparse transients sit with the beds instead of dominating
    // the peak normalise that follows.
    for(let i=0;i<len;i++) buf[i] = Math.tanh(buf[i]*1.1);
    return buf;
  }

  // ---------- WAV encoding (16-bit PCM mono): scale a master by gain ----------
  function encodeWAV(master, gain){
    const len = master.length;
    const buf = new ArrayBuffer(44 + len*2);
    const v = new DataView(buf);
    const ws = (o,s)=>{ for(let i=0;i<s.length;i++) v.setUint8(o+i, s.charCodeAt(i)); };
    ws(0,"RIFF"); v.setUint32(4, 36+len*2, true); ws(8,"WAVE");
    ws(12,"fmt "); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
    v.setUint32(24,SR,true); v.setUint32(28,SR*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true);
    ws(36,"data"); v.setUint32(40, len*2, true);
    let o=44;
    for(let i=0;i<len;i++){
      let s = master[i]*gain;
      s = s<-32768?-32768:s>32767?32767:s;
      v.setInt16(o, s, true); o+=2;
    }
    return new Blob([buf], {type:"audio/wav"});
  }

  // perceptual volume curve
  function gainFor(v){ return v<=0 ? 0 : Math.pow(v, 1.6); }

  let currentBlobUrl = null;
  function loadAudioBlob(samples){
    const blob = encodeWAV(samples, gainFor(state.volume));
    const url = URL.createObjectURL(blob);
    const at = el.audio.currentTime || 0;
    el.audio.src = url;
    if(currentBlobUrl) URL.revokeObjectURL(currentBlobUrl);
    currentBlobUrl = url;
    return at;
  }

  // ---------- Playback ----------
  async function selectSound(id){
    const cfg = SOUNDS.find(s=>s.id===id);
    if(!cfg) return;
    state.soundId = id;
    reflectSounds();
    setNow(`<b>${cfg.name}</b> · preparing…`);
    markLoading(id, true);
    try{
      if(!masters[id]){
        await new Promise(r=>setTimeout(r,20)); // let the spinner paint before the heavy render
        cache(id, render(cfg));
      }
    }catch(e){
      markLoading(id, false);
      setNow("Couldn’t create that sound");
      return;
    }
    markLoading(id, false);
    loadAudioBlob(masters[id]);
    await play();
    persist();
  }

  async function play(){
    if(!state.soundId) return;
    try{
      await el.audio.play();
      state.playing = true;
    }catch(e){
      state.playing = false;
    }
    reflectPlay();
    if(state.timerMin>0 && !state.timerEndsAt) startTimer(state.timerMin);
  }

  function pause(){
    el.audio.pause();
    state.playing = false;
    reflectPlay();
  }

  function togglePlay(){
    const id = state.soundId || DEFAULT_SOUND;
    if(state.playing){ pause(); return; }
    // Not yet rendered/loaded (fresh launch, default sound): build it, then play.
    if(!masters[id] || !el.audio.src){ selectSound(id); return; }
    play();
  }

  // ---------- Sleep timer ----------
  let tick = null, fadeRAF = null;
  function startTimer(min){
    clearTimer();
    state.timerMin = min;
    if(min<=0){ updateTimerLabel(); return; }
    state.timerEndsAt = Date.now() + min*60000;
    tick = setInterval(updateTimerLabel, 1000);
    updateTimerLabel();
  }
  function clearTimer(){
    if(tick){ clearInterval(tick); tick=null; }
    if(fadeRAF){ cancelAnimationFrame(fadeRAF); fadeRAF=null; }
    state.timerEndsAt = 0;
  }
  function updateTimerLabel(){
    if(state.timerMin<=0 || !state.timerEndsAt){
      el.sleepLabel.textContent="Sleep"; el.sleepBtn.classList.remove("active"); return;
    }
    let ms = state.timerEndsAt - Date.now();
    if(ms<=0){ el.sleepLabel.textContent="Sleep"; el.sleepBtn.classList.remove("active"); fadeAndStop(); return; }
    // fade over last 20s using an actual re-encode ramp
    const FADE=20000;
    if(ms<=FADE && state.playing && !fadeRAF) beginFade(ms);
    const s=Math.ceil(ms/1000), m=Math.floor(s/60), r=s%60;
    el.sleepLabel.textContent = `${m}:${String(r).padStart(2,"0")}`;
    el.sleepBtn.classList.add("active");
  }
  function beginFade(remaining){
    const startVol = state.volume, t0=Date.now(), dur=remaining;
    let last=1;
    const step=()=>{
      const p = Math.min(1, (Date.now()-t0)/dur);
      const f = 1-p;
      // re-encode occasionally so the fade is audible on iOS (volume baked into WAV)
      if(Math.abs(f-last)>0.12 && state.soundId && masters[state.soundId]){
        last=f;
        const blob = encodeWAV(masters[state.soundId], gainFor(startVol*f));
        const url = URL.createObjectURL(blob);
        el.audio.src=url; el.audio.play().catch(()=>{});
        if(currentBlobUrl) URL.revokeObjectURL(currentBlobUrl);
        currentBlobUrl=url;
      }
      if(p<1){ fadeRAF=requestAnimationFrame(step); }
    };
    fadeRAF=requestAnimationFrame(step);
  }
  function fadeAndStop(){
    clearTimer();
    state.timerMin=0;
    pause();
    // restore volume for next play
    if(state.soundId && masters[state.soundId]) loadAudioBlob(masters[state.soundId]);
    renderSleep();
    updateTimerLabel();
  }

  // ---------- Rendering / UI ----------
  function setNow(html){ el.now.innerHTML = html; }
  function reflectPlay(){
    el.play.classList.toggle("playing", state.playing);
    el.playIcon.querySelector("path").setAttribute("d", state.playing?ICON_PAUSE:ICON_PLAY);
    const cfg = SOUNDS.find(s=>s.id===state.soundId);
    if(cfg) setNow(nowText(cfg));
    else setNow("Pick a sound");
    reflectSounds();
    if("mediaSession" in navigator && cfg){
      navigator.mediaSession.playbackState = state.playing?"playing":"paused";
      navigator.mediaSession.metadata = new MediaMetadata({ title:cfg.name+" noise", artist:"Hush" });
    }
  }
  function nowText(cfg){
    if(state.playing) return `<b>${cfg.name}</b> · playing`;
    const started = !!el.audio.src && masters[state.soundId];
    return `<b>${cfg.name}</b> · ${started ? "paused" : "tap play"}`;
  }

  // ---------- Sounds panel (top-right) ----------
  function renderSounds(){
    el.soundsPanel.innerHTML = '<h4>More sounds</h4>' + SOUNDS.map(s=>
      `<button class="opt" role="menuitemradio" data-id="${s.id}">
        <span class="ico">${s.ico}</span>
        <span class="txt"><span class="nm">${s.name}</span><span class="sub">${s.desc||""}</span></span>
        <span class="chk">✓</span>
      </button>`).join("");
    reflectSounds();
  }
  function reflectSounds(){
    for(const node of el.soundsPanel.querySelectorAll(".opt")){
      const on = node.dataset.id === state.soundId;
      node.classList.toggle("on", on);
      node.setAttribute("aria-checked", String(on));
    }
    const cfg = SOUNDS.find(s=>s.id===state.soundId);
    if(cfg){ el.soundsIco.textContent = cfg.ico; el.soundsLabel.textContent = cfg.name; }
  }
  // Loading spins the big play button while a sound renders.
  function markLoading(id, on){ el.play.classList.toggle("loading", on); }

  // ---------- Sleep panel (top-left) ----------
  function renderSleep(){
    el.sleepPanel.innerHTML = '<h4>Sleep timer</h4>' + TIMERS.map(m=>
      `<button class="opt${m===state.timerMin?' on':''}" role="menuitemradio" data-min="${m}"
               aria-checked="${m===state.timerMin}">
        <span class="txt"><span class="nm">${m===0?"Off":m+" min"}</span></span>
        <span class="chk">✓</span>
      </button>`).join("");
  }

  // ---------- Volume slider ----------
  function setVolFill(){ el.vol.style.setProperty("--fill", (state.volume*100)+"%"); }

  // ---------- Dropdown open/close ----------
  function closePanels(){
    el.sleepPanel.classList.remove("show"); el.soundsPanel.classList.remove("show");
    el.sleepBtn.classList.remove("open"); el.soundsBtn.classList.remove("open");
    el.sleepBtn.setAttribute("aria-expanded","false"); el.soundsBtn.setAttribute("aria-expanded","false");
    el.scrim.classList.remove("show");
  }
  function togglePanel(which){
    const panel = which==="sleep" ? el.sleepPanel : el.soundsPanel;
    const btn   = which==="sleep" ? el.sleepBtn   : el.soundsBtn;
    const isOpen = panel.classList.contains("show");
    closePanels();
    if(!isOpen){
      panel.classList.add("show"); btn.classList.add("open");
      btn.setAttribute("aria-expanded","true"); el.scrim.classList.add("show");
    }
  }

  // ---------- Events ----------
  el.play.addEventListener("click", togglePlay);
  el.sleepBtn.addEventListener("click", ()=>togglePanel("sleep"));
  el.soundsBtn.addEventListener("click", ()=>togglePanel("sounds"));
  el.scrim.addEventListener("click", closePanels);
  document.addEventListener("keydown", e=>{ if(e.key==="Escape") closePanels(); });

  el.soundsPanel.addEventListener("click", e=>{
    const b = e.target.closest(".opt"); if(!b) return;
    closePanels();
    if(b.dataset.id !== state.soundId) selectSound(b.dataset.id);
  });
  el.sleepPanel.addEventListener("click", e=>{
    const b = e.target.closest(".opt"); if(!b) return;
    const m = +b.dataset.min;
    if(m===0){ clearTimer(); state.timerMin=0; }
    else startTimer(m);
    renderSleep(); updateTimerLabel(); persist();
    // restore full volume if we were mid-fade
    if(state.soundId && masters[state.soundId]) loadAudioBlob(masters[state.soundId]);
    if(state.playing) el.audio.play().catch(()=>{});
    closePanels();
  });

  // Volume is baked into the WAV (iOS ignores audio.volume). Re-encoding the long master
  // is heavy, so a drag only moves the fill; the new level is applied once on release.
  el.vol.addEventListener("input", ()=>{ state.volume = +el.vol.value/100; setVolFill(); });
  el.vol.addEventListener("change", ()=>{
    if(state.soundId && masters[state.soundId]){
      loadAudioBlob(masters[state.soundId]);
      if(state.playing) el.audio.play().catch(()=>{});
    }
    persist();
  });

  el.audio.addEventListener("play", ()=>{ state.playing=true; reflectPlay(); });
  el.audio.addEventListener("pause", ()=>{ if(!fadeRAF){ state.playing=false; reflectPlay(); } });

  if("mediaSession" in navigator){
    navigator.mediaSession.setActionHandler("play", ()=>play());
    navigator.mediaSession.setActionHandler("pause", ()=>pause());
  }

  // ---------- Persistence ----------
  function persist(){
    try{ localStorage.setItem("hush", JSON.stringify({
      soundId:state.soundId, volume:state.volume, timerMin:state.timerMin
    })); }catch(e){}
  }
  function restore(){
    try{
      const s = JSON.parse(localStorage.getItem("hush")||"{}");
      if(typeof s.volume==="number") state.volume=s.volume;
      if(typeof s.timerMin==="number") state.timerMin=s.timerMin;
      if(s.soundId && SOUNDS.some(x=>x.id===s.soundId)) state.soundId=s.soundId;
    }catch(e){}
  }

  // ---------- Init ----------
  restore();
  if(!state.soundId) state.soundId = DEFAULT_SOUND;   // Breeze is the default sound
  el.vol.value = Math.round(state.volume*100);
  setVolFill();
  renderSounds();
  renderSleep();
  updateTimerLabel();
  reflectPlay();
  const initCfg = SOUNDS.find(s=>s.id===state.soundId);
  if(initCfg) setNow(nowText(initCfg));

  // Service worker for true offline
  if("serviceWorker" in navigator){
    window.addEventListener("load", ()=> navigator.serviceWorker.register("sw.js").catch(()=>{}));
  }
})();
</script>
</body>
</html>
